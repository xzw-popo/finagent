[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fin-research-agent"
version = "0.1.0"
description = "Auditable, evidence-first multi-agent financial research workflow"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx[socks]>=0.28,<1",
  "openai>=2.0,<3",
  "pydantic>=2.10,<3",
]

[project.scripts]
finresearch = "finresearch.cli:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
